worker_processes  1;
error_log logs/error.log;
events {
    worker_connections 1024;
}
http {
    server {
        listen 8088;

        location /builtin_vars {
            content_by_lua_block {
                ngx.say(ngx.var.host, '\n', ngx.var.uri);
                ngx.say(ngx.var.args, '\n', ngx.var.arg_name);
            }
        }

        # Define a custom variable
        set $mobile_device "false";

        # Check user agent and set the variable
        if ($http_user_agent ~* "mobile|android|iphone|ipad") {
            set $mobile_device "true";
        }

        location /custom_vars {
            content_by_lua_block {
                ngx.say("mobile_device:", ngx.var.mobile_device);
            }
        }

        location / {
            default_type text/html;
            content_by_lua_block {
                ngx.say("<p>hello, world</p>")
            }
        }

        # Get http request headers
        location /headers {
            content_by_lua_block {
                ngx.say("<p>Request Headers:</p>")
                for k, v in pairs(ngx.req.get_headers()) do
                    ngx.say(k .. ": " .. v)
                end
                ngx.say("<p>Request host:</p>", ngx.req.get_headers()["host"]);
            }
        }
        # Get http request headers with multiple values
        location /Foos {
            content_by_lua_block {
                ngx.say("Foo header values:\n");
                for i =1, #ngx.req.get_headers()["Foo"] do
                    ngx.say("Foo header value: ", ngx.req.get_headers()["Foo"][i]);
                end
            }
        }
        # Get http request uri arguments
        location /get_uri_args {
            content_by_lua_block {
                local utils = require "lua/utils"
                local args = ngx.req.get_uri_args()
                utils.sayTable(args)
            }
        }
        # Get http request post args
        location /get_post_args {
            content_by_lua_block {
                ngx.req.read_body()
                local args, err = ngx.req.get_post_args()
                if args then
                    local utils = require "lua/utils"
                    utils.sayTable(args)
                else
                    ngx.say("failed to get post args:", err)
                end
            }
        }
        location /get_random_string {
          content_by_lua_file lua/get_random_string.lua;
        }

        location /decode_info {
            content_by_lua_file lua/decode_info.lua;
        }

        location /test/json {
            content_by_lua_file lua/test_json.lua;
        }

        location = /test/redis_basic {
            content_by_lua_file lua/test_redis.lua;
        }

        location /test/redis_iresty {
            content_by_lua_file lua/test_redis_iresty.lua;
        }

        location /test/mysql {
            content_by_lua_file lua/test_mysql.lua;
        }

        location /sign {
            access_by_lua_file lua/access_by_sign.lua;
            echo "Signed content";
        }

        location /_md5 {
            internal;
            # compute MD5 hash of the input argument "input"
            content_by_lua_block {
                ngx.say(ngx.md5(ngx.var.arg_input))
            }
        }
        location /_authorization {
            internal;
            content_by_lua_block {
                local auth = ngx.var.http_Authorization
                if auth ~= "qwer1234" then
                return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end
                return ngx.exit(ngx.HTTP_OK) 
            }
        }
        location /args2md5 {
            content_by_lua_block {
                local authRes = ngx.location.capture("/_authorization")
                if authRes.status ~= ngx.HTTP_OK then
                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end
                local res = ngx.location.capture("/_md5", { args = { input = ngx.var.arg_name } } )
                ngx.say("Response from internal MD5: ", res.body)
            }
        }
        location /_base64 {
            internal;
            # compute base64 encoding of the input argument "input"
            content_by_lua_block {
                ngx.say(ngx.encode_base64(ngx.var.arg_input))
            }   
        }
        location /md5_and_base64 {
            content_by_lua_block {
                local authRes = ngx.location.capture("/_authorization")
                if authRes.status ~= ngx.HTTP_OK then
                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end
                local option = { args = { input = ngx.var.arg_name } }
                local md5Res, base64Res = ngx.location.capture_multi({
                    {"/_md5", option },
                    {"/_base64", option }
                })
                ngx.say("MD5: ", md5Res.body, "Base64: ", base64Res.body);
            }
        }
    }
}